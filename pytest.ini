[pytest]
# Lets tests import the framework package from src/ without installing it
pythonpath = src
testpaths = tests

addopts =
    -ra
    --import-mode=importlib
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --output=reports/artifacts
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure

markers =
    smoke: fast checks of critical paths, run on every pull request
    sanity: quick check after a change or deployment
    regression: full suite, run nightly
    ui: browser-based test
    api: API test
    auth: auth module (login)
    admin: Settings > General > Users > Admin
    creates_data: test adds records to the application (never runs on demo)
    flaky: known unstable test under review
